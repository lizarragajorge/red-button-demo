name: Validate demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check indexed publication paths
        run: python3 scripts/check_publication.py
      - name: Scan history for secrets
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -f "$work/gitleaks" "$work/gitleaks.tar.gz"; rmdir "$work"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$work/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          "$work/gitleaks" git --redact --no-banner --log-opts=--all .
      - name: Check public dependency advisories
        run: python3 scripts/audit_dependencies.py

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Restore from approved feeds
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          npm ci --include=dev --ignore-scripts
      - name: Test Python and build frontend
        run: |
          python -m pytest -p no:cacheprovider
          npm run check
          npm run build
      - name: Install test browser
        run: npm run test:install-browser -- --with-deps
      - name: Test browser flows
        run: npm run test:e2e

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
